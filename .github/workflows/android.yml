name: Android build and release
on:
  push:
    branches: [main]
    paths: ['ytmusic-android/**', '.github/workflows/android.yml']
  # Pull requests are only compiled (debug key, no release): nothing reaches the devices until main.
  pull_request:
    paths: ['ytmusic-android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ytmusic-android/ytmusic.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KEYSTORE_BASE64 secret is missing: building with the debug key and NOT publishing a release (it could not install over your existing app)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        working-directory: ytmusic-android
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleRelease 2>&1 | tee /tmp/android-build.log
      - name: Publish result to the android-ci branch
        if: always()
        shell: bash
        run: |
          sha=$(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)
          mkdir -p /tmp/out && cd /tmp/out
          grep -n -B2 -A12 '^e: \|What went wrong\|warning:.*unused\|BUILD ' /tmp/android-build.log > build-summary.log 2>/dev/null || true
          tail -150 /tmp/android-build.log > build-tail.log 2>/dev/null || true
          echo "${sha} ${{ job.status }} ${{ github.event_name }} ${{ github.head_ref || github.ref_name }}" > status.txt
          git init -q && git checkout -q -b android-ci
          git add -A && git -c user.name=ci -c user.email=ci@localhost commit -q -m "CI ${sha}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" android-ci
      - name: Package
        id: pkg
        run: |
          code=$(grep -oP 'versionCode = \K\d+' ytmusic-android/app/build.gradle.kts)
          name=$(grep -oP 'versionName = "\K[^"]+' ytmusic-android/app/build.gradle.kts)
          apk="ytmusic-fire-$code.apk"
          mkdir -p out
          cp ytmusic-android/app/build/outputs/apk/release/app-release.apk "out/$apk"
          sha=$(sha256sum "out/$apk" | cut -d' ' -f1)
          python3 - "$code" "$name" "$apk" "$sha" "$(git log -1 --format=%s)" <<'PY'
          import json, sys
          code, name, apk, sha, notes = sys.argv[1:6]
          json.dump({"versionCode": int(code), "versionName": name, "apk": apk, "sha256": sha, "notes": notes}, open("out/version.json", "w"), indent=2)
          PY
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ytmusic-apk
          path: out/*
      - name: Publish GitHub release (the app's updater reads releases/latest)
        if: steps.key.outputs.signed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.pkg.outputs.name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber
          else
            gh release create "$tag" out/* --title "YT Music ${{ steps.pkg.outputs.name }}" --notes "$(git log -1 --format=%s)" --latest
          fi
