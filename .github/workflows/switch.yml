name: Switch build
on:
  push:
    branches: [switch, main]
    paths: ['ytmusic-switch/**', '.github/workflows/switch.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Portlibs
        run: |
          dkp-pacman -Sy --noconfirm --needed switch-sdl2 switch-sdl2_ttf switch-sdl2_image switch-curl switch-ffmpeg switch-mbedtls switch-libjpeg-turbo switch-libpng switch-freetype switch-harfbuzz switch-zlib 2>&1 | tail -5 || true
          dkp-pacman -Qq | grep '^switch-' > /tmp/pkgs.txt || true
      - name: Build
        working-directory: ytmusic-switch
        run: |
          set -o pipefail
          make -j4 2>&1 | tee /tmp/build.log
      - name: Publish result
        if: always()
        run: |
          git config --global --add safe.directory '*'
          sha=$(git rev-parse --short HEAD)
          mkdir -p /tmp/out && cd /tmp/out
          cp /tmp/build.log build.log 2>/dev/null || echo "no build log" > build.log
          cp /tmp/pkgs.txt pkgs.txt 2>/dev/null || true
          cp $GITHUB_WORKSPACE/ytmusic-switch/*.nro . 2>/dev/null || true
          echo "${sha} ${{ job.status }}" > status.txt
          git init -q && git checkout -q -b switch-ci
          git add -A && git -c user.name=ci -c user.email=ci@localhost commit -q -m "CI ${sha}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" switch-ci
