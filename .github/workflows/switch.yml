name: Switch build
on:
  push:
    branches: [switch, main]
    paths: ['ytmusic-switch/**', '.github/workflows/switch.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Portlibs
        run: |
          dkp-pacman -Sy --noconfirm --needed switch-sdl2 switch-sdl2_ttf switch-sdl2_image switch-curl switch-ffmpeg switch-mbedtls switch-libjpeg-turbo switch-libpng switch-freetype switch-harfbuzz switch-zlib 2>&1 | tail -5 || true
          dkp-pacman -Qq | grep '^switch-' > /tmp/pkgs.txt || true
      - name: Cache minimal ffmpeg (background service)
        uses: actions/cache@v4
        with:
          path: ytmusic-switch/ffmpeg-min
          key: ffmpeg-min-none-n7.1-v2
      - name: Build minimal ffmpeg for the background service
        shell: bash
        working-directory: ytmusic-switch
        run: |
          set -o pipefail
          if [ ! -f ffmpeg-min/lib/libavcodec.a ]; then
            git clone -q --depth 1 -b n7.1 https://github.com/FFmpeg/FFmpeg.git /tmp/ffsrc
            cd /tmp/ffsrc
            export PATH=$DEVKITPRO/devkitA64/bin:$PATH
            ./configure --prefix=$GITHUB_WORKSPACE/ytmusic-switch/ffmpeg-min --enable-cross-compile --cross-prefix=aarch64-none-elf- \
              --arch=aarch64 --cpu=cortex-a57 --target-os=none --enable-pic \
              --extra-cflags="-D__SWITCH__ -D_GNU_SOURCE -O2 -march=armv8-a+crc+crypto -mtune=cortex-a57 -mtp=soft -fPIC -ftls-model=local-exec -ffunction-sections -fdata-sections -I$DEVKITPRO/libnx/include" \
              --extra-ldflags="-L$DEVKITPRO/libnx/lib" \
              --disable-everything --disable-programs --disable-doc --disable-network --disable-autodetect --disable-pthreads \
              --disable-avdevice --disable-avfilter --disable-swscale --disable-debug --enable-static --disable-shared \
              --enable-avcodec --enable-avformat --enable-swresample \
              --enable-decoder=opus,aac --enable-demuxer=matroska,mov --enable-parser=opus,aac 2>&1 | tail -15 | tee /tmp/ffconf.log || { tail -40 ffbuild/config.log | tee -a /tmp/ffconf.log; exit 1; }
            make -j4 > /tmp/ffbuild.log 2>&1 || { tail -60 /tmp/ffbuild.log | tee -a /tmp/ffconf.log; exit 1; }
            make install > /tmp/ffinstall.log 2>&1 || { tail -30 /tmp/ffinstall.log; exit 1; }
          fi
          ls -la ffmpeg-min/lib
      - name: Build background service (sysmodule)
        shell: bash
        working-directory: ytmusic-switch/bg
        run: |
          set -o pipefail
          make -j4 2>&1 | tee /tmp/bg.log
          mkdir -p ../romfs/bg && cp ytmusic-bg.nsp ../romfs/bg/exefs.nsp && ls -la ytmusic-bg.nsp
      - name: Build
        working-directory: ytmusic-switch
        shell: bash
        run: |
          set -o pipefail
          make -j4 2>&1 | tee /tmp/build.log
      - name: Host test (real YouTube)
        if: always()
        shell: bash
        working-directory: ytmusic-switch
        run: |
          (apt-get update -qq && apt-get install -y -qq g++ pkg-config libcurl4-openssl-dev libavformat-dev libavcodec-dev libswresample-dev libavutil-dev libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev fonts-dejavu-core) > /tmp/apt.log 2>&1 || tail -20 /tmp/apt.log
          set -o pipefail
          { g++ -std=gnu++20 -O1 -o /tmp/host_test tests/host_test.cpp source/yt.cpp source/net.cpp source/player.cpp source/downloads.cpp source/common.cpp \
              $(pkg-config --cflags --libs libcurl libavformat libavcodec libswresample libavutil sdl2) -lpthread \
            && cd /tmp && SDL_AUDIODRIVER=disk SDL_DISKAUDIODELAY=40 timeout 300 /tmp/host_test; } 2>&1 | tee /tmp/host.log
      - name: Background service test (real YouTube)
        if: always()
        shell: bash
        working-directory: ytmusic-switch
        run: |
          set -o pipefail
          { g++ -std=gnu++20 -O1 -o /tmp/bg_test tests/bg_host_test.cpp bg/source/engine.cpp bg/source/service.cpp bg/source/resolve.cpp source/net.cpp \
              $(pkg-config --cflags --libs libcurl libavformat libavcodec libswresample libavutil sdl2) -lpthread \
            && cd /tmp && SDL_AUDIODRIVER=disk SDL_DISKAUDIODELAY=40 timeout 300 /tmp/bg_test; } 2>&1 | tee /tmp/bgtest.log
      - name: UI screenshots (Linux)
        if: always()
        shell: bash
        working-directory: ytmusic-switch
        run: |
          mkdir -p /tmp/shots
          { g++ -std=gnu++20 -O1 -o /tmp/host_ui tests/host_ui.cpp $(ls source/*.cpp | grep -v main.cpp) \
              $(pkg-config --cflags --libs libcurl libavformat libavcodec libswresample libavutil sdl2 SDL2_ttf SDL2_image) -lpthread \
            && cd /tmp/shots && SDL_AUDIODRIVER=disk SDL_DISKAUDIODELAY=40 timeout 120 /tmp/host_ui; } 2>&1 | tee /tmp/ui.log
      - name: Publish result
        if: always()
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          sha=$(git rev-parse --short HEAD)
          mkdir -p /tmp/out && cd /tmp/out
          cp /tmp/build.log build.log 2>/dev/null || echo "no build log" > build.log
          cp /tmp/pkgs.txt pkgs.txt 2>/dev/null || true
          cp /tmp/host.log host.log 2>/dev/null || true
          cp /tmp/ui.log ui.log 2>/dev/null || true
          cp /tmp/bg.log bg-build.log 2>/dev/null || true
          cp /tmp/bgtest.log bg-test.log 2>/dev/null || true
          cp /tmp/ffconf.log ffconf.log 2>/dev/null || true
          tail -80 /tmp/ffbuild.log > ffbuild.log 2>/dev/null || true
          tail -40 /tmp/ffinstall.log > ffinstall.log 2>/dev/null || true
          cp $GITHUB_WORKSPACE/ytmusic-switch/bg/ytmusic-bg.nsp . 2>/dev/null || true
          cp /tmp/shots/*.png . 2>/dev/null || true
          cp /tmp/ytmusic-data/log.txt host-applog.txt 2>/dev/null || true
          cp $GITHUB_WORKSPACE/ytmusic-switch/*.nro . 2>/dev/null || true
          echo "${sha} ${{ job.status }}" > status.txt
          git init -q && git checkout -q -b switch-ci
          git add -A && git -c user.name=ci -c user.email=ci@localhost commit -q -m "CI ${sha}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" switch-ci
